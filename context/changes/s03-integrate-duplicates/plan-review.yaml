acceptance_checks:
  - task_id: T-01
    criterion_index: 0
    assessment: pass
    given: Identical sources with matching catalog or earlier batch content, including same or different paths and years.
    when: Integrate each source.
    then: Source hash and size select candidates; independently rehash safe candidate and reuse verified archive path without a new file.
  - task_id: T-01
    criterion_index: 1
    assessment: pass
    given: New content and an occupied destination with different content.
    when: Integrate each source.
    then: New content is copied and independently verified; occupied destination is not overwritten and reports failure.
  - task_id: T-01
    criterion_index: 2
    assessment: pass
    given: Malformed or unreadable catalog, or matching candidates missing, altered, unsafe or unreadable.
    when: Integrate a source.
    then: Catalog read failure prevents writes; if no matching candidate verifies, source fails closed and is preserved.
  - task_id: T-02
    criterion_index: 0
    assessment: pass
    given: Two verified sources with distinct sidecars and an existing version 1 catalog.
    when: Persist and reload their associations.
    then: Each record retains its own metadata, provenance and attributes and shares the verified path and hash; existing records remain readable.
  - task_id: T-02
    criterion_index: 1
    assessment: pass
    given: A verified association and an injected catalog publication failure.
    when: Save the catalog.
    then: Report affected unpersisted associations, preserve previous catalog and original and staged sources, and return failure.
  - task_id: T-02
    criterion_index: 2
    assessment: pass
    given: Persisted records for distinct sources sharing content.
    when: Browse after restart.
    then: Display input path and relative path for each record alongside its metadata.
  - task_id: T-03
    criterion_index: 0
    assessment: pass
    given: Duplicate sources with different metadata, names and years, in one batch and across restart.
    when: Run the end-to-end tests.
    then: Assert one media file, verified hashes and individually attributable persisted records.
  - task_id: T-03
    criterion_index: 1
    assessment: pass
    given: Collisions, invalid candidates, malformed catalog, copy or verification and catalog write failures.
    when: Run failure tests.
    then: Assert diagnostics, no false success or overwrite, intact sources and retained prior records.
  - task_id: T-03
    criterion_index: 2
    assessment: pass
    given: Implemented association behavior and existing CLI and data model contracts.
    when: Update contracts and run scripts/test.ps1.
    then: Contracts reflect behavior and the solution builds and tests pass.
findings: []
summary: The plan covers both S-03 completion criteria and supplies executable positive and failure checks. Review is against the plan only; implementation and product tests have not been run.
