findings:
  - id: R-01
    severity: major
    target: design.contracts Attribute capture; tasks.T-03.done_when[0]; verification.V-02
    issue: The plan says attributes are retained when reliably obtainable but chooses no extraction mechanism, supported values or known-value fixture. S-01 provides none of dimensions, duration or frame rate, so an implementation can mark every such value unknown even for media with accessible metadata, leaving FR-011 and the S-02 available-attributes criterion unverifiable.
    required_fix: Specify an evidence-backed minimal route for obtaining available attributes, the format or source coverage and explicit unavailable rules, and tests with known dimensions and video attributes plus unknown cases; if the necessary evidence is unavailable, resolve it or keep the plan draft.
    evidence: research.yaml F-02 and open_questions; BatchInspector.cs InspectedMediaItem; prd.yaml FR-011; plan.yaml design Attribute capture
  - id: R-02
    severity: major
    target: design.components Archive CLI command; verification.V-02
    issue: V-02 requires a fresh process that reads the catalog after staging removal, but the sole proposed command requires fresh input and a new staging directory and no catalog read entry point or independent read test is specified. The advertised restart check cannot be executed as described.
    required_fix: Specify a concrete executable fresh-process catalog read path or test harness and the exact assertions after staging removal, without requiring a new archive batch or expanding product scope.
    evidence: plan.yaml design.components, CLI to Core contract and V-02; prd.yaml NFR-002 and US-02
summary: Two new major findings block approval; attribute extraction and the fresh-process persistence check lack executable HOW. Duplicate integration and automatic resumption remain correctly deferred to later slices.
