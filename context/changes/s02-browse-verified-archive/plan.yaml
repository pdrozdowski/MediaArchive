goal:
  outcome: The operator can archive batch media, verify their content, and browse
    them by year after a restart.
  done_when:
  - Archived content is hash verified and verification failures are reported while
    source media remain intact.
  - The local file-based catalog retains available original metadata and specified
    media attributes, marking unavailable values unknown, across restarts.
  - Archived photos and videos can be browsed in year-based folders.
baseline:
- finding: S-01 stages sources and inspects sidecars, dates and prospective paths
    without writing the archive; inspection records do not include hashes or media
    dimensions.
  evidence: src/MediaArchive.Core/BatchInspector.cs
- finding: The inspect CLI prints staging and inspection results; staging rejects
    root overlap, links and preexisting destinations.
  evidence: src/MediaArchive.CLI/Program.cs; src/MediaArchive.Core/BatchStager.cs
- finding: Core targets .NET 10 without package references; research compares stream
    SHA-256, JSON and SQLite.
  evidence: src/MediaArchive.Core/MediaArchive.Core.csproj; context/changes/s02-browse-verified-archive/research.yaml
approach:
  summary: Add an archive command using S-01 staging and inspection, copying media
    into year folders, independently hashing source and destination, and persisting
    verified records in a local JSON catalog. Keep all source and staged files; report
    any failure and never overwrite an existing archive file.
  reuse:
  - option: BatchStager and BatchInspector
    decision: reuse
    reason: Existing validation, source hierarchy, metadata association and year selection
      are established contracts.
  - option: SHA256 stream API and System.Text.Json
    decision: reuse
    reason: Platform facilities support required hashes and persistent structured
      data without an additional dependency; SQLite would add a package and still
      cannot atomically commit media files with catalog updates.
  - option: ffprobe command-line media probing
    decision: reuse
    reason: Documented JSON stream and format output provides dimensions, duration
      and frame rate without custom media parsers; https://ffmpeg.org/ffprobe.html.
      Requires an operator-provided ffprobe executable.
  decisions:
  - topic: Catalog representation
    choice: Versioned JSON catalog under the archive root, with records holding verified
      media and associated source metadata.
    rationale: Single-user local slice needs restart persistence and complete metadata
      without adding a database dependency.
    authority: agent_proposed
  - topic: Collision and cleanup policy
    choice: Report existing or colliding targets as failures without overwrite; never
      delete source or staged media.
    rationale: Preserves data until later duplicate integration and recovery slices
      define broader behavior.
    authority: agent_proposed
  - topic: Archive organization
    choice: Use S-01 selected year or Unknown folder and original filename.
    rationale: Inherits the established inspection contract and approved year-based
      browsing.
    authority: inherited
design:
  components:
  - name: Archive CLI command
    responsibility: Parse the same input, staging and archive root options as inspect;
      run staging, inspection and archive integration; print per-item results and
      diagnostics with nonzero status on failures.
    touchpoints:
    - src/MediaArchive.CLI/Program.cs
    - context/contracts/cli-interface.md
  - name: Core archive integration and catalog
    responsibility: Validate archive boundaries, copy and verify staged media, persist
      and reload records, and report failures.
    touchpoints:
    - src/MediaArchive.Core
    - context/contracts/data-model.md
  data_flow:
  - Archive command stages input using BatchStager and inspects via BatchInspector;
    incomplete staging aborts integration and reports failure.
  - Resolve each inspected item to its successful staged input root and relative path;
    validate containment and archive root paths, reject reparse points and collisions,
    and copy without overwrite into year or Unknown folder.
  - Independently hash staged source and destination with SHA-256; only matching copies
    may be represented as verified catalog entries.
  - Persist each verified record with full associated sidecar JSON, source identity,
    archive location, media kind, year, timestamps, size, hash and known attributes;
    read the catalog on later process invocation.
  contracts:
  - boundary: CLI to Core
    input: One or more ZIP or folder inputs, new staging parent and name, archive
      root.
    output: Per-item verified or failed result with path and diagnostics; exit 0 only
      if staging and all archive and catalog writes succeed, 1 on processing failure,
      2 on invalid arguments.
  - boundary: Catalog persistence
    input: Verified copy and inspection record.
    output: Versioned local JSON with original sidecar object or explicit unknown,
      source identity and explicit unknown values for unavailable specified attributes;
      preserve existing records on update.
  - boundary: Attribute capture
    input: Inspected sidecar and staged media file.
    output: Run ffprobe on each staged file using argument-list invocation with -v
      error -select_streams v:0 -show_entries stream=width,height,avg_frame_rate,duration:format=duration
      -of json. Use positive width and height; for video use valid stream duration
      with format duration fallback and positive rational average frame rate with
      nonzero denominator; photos have unknown duration and fps. Record missing, malformed
      or unsupported fields explicitly unknown; preserve full sidecar and its available
      timestamps. ffprobe unavailable or failure produces a diagnostic and unknown
      probe-derived fields, never a fabricated value. File size, hashes, and processing
      timestamps come from file and workflow.
  - boundary: Fresh-process catalog read test
    input: Archive root containing persisted catalog; no staging or batch input
    output: A small test helper process calls the Core catalog reader and emits JSON;
      integration test removes staging, launches helper, and asserts saved records
      and explicit unknowns.
  failure_semantics:
  - case: Failed staging, unreadable media, copy error, hash mismatch or destination
      collision
    behavior: Report failure, never delete or alter input or staged source, never
      overwrite an existing archive file, and never catalog the failed copy as verified.
      Leave any uncertain partial output identifiable and report its path.
  - case: Catalog missing, malformed, unreadable or write fails
    behavior: Missing catalog starts empty only when genuinely absent; malformed or
      unreadable catalog fails closed without replacing it. Write a temporary file
      in the catalog directory and replace the catalog only after complete serialization;
      report write failure and any already verified but uncataloged copy, leaving
      existing catalog and sources intact.
  - case: Interrupted copy or publication
    behavior: Never assume a leftover file is verified; no automatic overwrite or
      blind retry. Report a collision for a subsequent attempt and retain sources
      for manual resolution; full resumption belongs to S-04.
  - case: Unsafe paths or links
    behavior: Reject paths escaping roots or traversing reparse points and report
      failure before writing media.
