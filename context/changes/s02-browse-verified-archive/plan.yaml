verification:
- id: V-01
  criterion: Archived content is hash verified and verification failures are reported
    while source media remain intact.
  method: automated
  check: Compare fixture source and destination digests; inject copy, hash mismatch
    and read failures; assert reported failure, no verified catalog record, and unchanged
    source and staged bytes.
- id: V-02
  criterion: The local file-based catalog retains available original metadata and
    specified media attributes, marking unavailable values unknown, across restarts.
  method: automated
  check: Archive known-dimension photo and known-dimension, duration and frame-rate
    video fixtures using ffprobe, plus missing-value fixtures; remove staging, run
    a separate helper process invoking the Core catalog reader, and assert full sidecar,
    source identity, required known values and explicit unknowns and existing records.
    Inject unavailable probe, malformed catalog and write failure.
- id: V-03
  criterion: Archived photos and videos can be browsed in year-based folders.
  method: mixed
  check: Archive dated photo and video plus unknown-date fixture, assert actual year
    and Unknown paths and inspect folders manually; test collision without overwrite.
risks:
- description: Media attribute extraction coverage varies by format and no quantitative
    lightweight threshold is specified.
  mitigation: Use documented ffprobe when installed, report unavailable or failed
    probing and explicitly mark affected attributes unknown; preserve full metadata.
    Defer catalog performance measurement until representative volume is known.
  blocking: false
- description: File publication and catalog updates are not one transaction.
  mitigation: Report verified but uncataloged copies and fail closed on existing paths;
    retain sources for manual correction.
  blocking: false
later:
- item: Duplicate associations and automatic recovery of interrupted work.
  revisit_when: S-03 and S-04 are planned.
