goal:
  outcome: The operator can extract a Takeout batch and inspect its recognized media
    and preparation information.
  done_when:
  - Extraction preserves the source hierarchy and reports failures without removing
    source media.
  - Each recognized item shows available metadata, explicit unknowns, intended archive
    location and processing timestamps.
baseline:
- finding: Core, CLI and tests are starter placeholders; no existing extraction or
    preparation implementation.
  evidence: src/MediaArchive.Core/Class1.cs; src/MediaArchive.CLI/Program.cs; tests/MediaArchive.Tests/UnitTest1.cs
- finding: Partial research establishes ZIP platform behavior and limited same-directory
    sidecar evidence; complete-batch matching remains unverified.
  evidence: context/changes/s01-inspect-takeout-batch/research.yaml
approach:
  summary: Inspect one operator-specified batch of ZIPs and extracted folders in isolated
    staging, prepare item records, and display them without modifying source or archive.
  reuse:
  - option: .NET System.IO.Compression and System.Text.Json
    decision: reuse
    reason: Built-in ZIP and JSON support; existing research documents ZIP path and
      partial extraction caveats.
  - option: Existing Core/CLI/test code
    decision: adapt
    reason: Projects exist but contain only starter placeholders; use Core for logic
      and xUnit for tests.
  decisions:
  - topic: Inputs and batch
    choice: Accept one or more ZIP files and/or extracted folders as an explicitly
      supplied batch; stage each input in its own numbered root to preserve hierarchy
      and avoid cross-part collisions.
    rationale: User selected both input types and multiple parts.
    authority: user_confirmed
  - topic: Year and metadata matching
    choice: Use an unambiguously associated valid photo-taken metadata date, then
      a valid date in the media filename, otherwise Unknown; report ambiguous and
      cross-part sidecars as unresolved.
    rationale: User chose date precedence and conservative unresolved associations.
    authority: user_confirmed
  - topic: Recognition
    choice: 'Recognize common photo and video extensions case-insensitively: jpg,
      jpeg, png, gif, webp, heic, heif, bmp, tif, tiff, mp4, mov, m4v, avi, mpg, mpeg,
      3gp, and webm; report other files as unrecognized.'
    rationale: Concrete initial coverage for user-selected common formats; explicit
      reporting avoids silent omission.
    authority: agent_proposed
  - topic: Filename date
    choice: Accept a unique valid YYYYMMDD or YYYY-MM-DD date token bounded by non-digits
      in the filename; multiple distinct dates, invalid dates, or absent dates produce
      Unknown.
    rationale: Deterministic conservative fallback; no inferred dates from filesystem
      timestamps.
    authority: agent_proposed
