design:
  components:
  - name: Core batch inspection
    responsibility: Validate and stage inputs, enumerate media and sidecars, associate
      only safe matches and produce item records and diagnostics.
    touchpoints:
    - src/MediaArchive.Core/
  - name: CLI inspection command
    responsibility: Accept input paths, fresh staging parent and prospective archive
      root; display structured item records and diagnostics, set exit status.
    touchpoints:
    - src/MediaArchive.CLI/Program.cs
    - context/contracts/cli-interface.md
    - context/contracts/data-model.md
  data_flow:
  - CLI input paths and roots -> validate separation -> fresh isolated batch directory
    -> copy folder inputs and extract ZIPs into per-input roots -> enumerate recognized
    media and sidecars -> associate and prepare records -> display results and diagnostics.
  - The intended path is prospective archive root / year or Unknown / original filename;
    report collisions rather than assuming uniqueness. No archive writes or source
    cleanup.
  contracts:
  - boundary: CLI to Core
    input: One or more ZIP or directory paths, staging parent, prospective archive
      root.
    output: Batch status, per-input failures and per-item source-relative path, media
      type, available associated sidecar JSON, explicit unknowns, intended path and
      UTC preparation timestamp.
  - boundary: Metadata association
    input: Media and sidecars within each staged input directory.
    output: Associate only when parsed JSON title exactly equals a same-directory
      media basename and exactly one sidecar and one media claim that title; preserve
      all available JSON fields, report malformed, missing, competing and cross-part
      candidates unresolved.
  - boundary: Date selection
    input: Unambiguous sidecar photoTakenTime.timestamp and media filename.
    output: Parse timestamp as integer Unix seconds in UTC, require valid representable
      date and use its UTC year. If missing, malformed, zero or out of range, try
      the specified filename token rule; only if that fails use Unknown. Preserve
      raw metadata and diagnostic.
  failure_semantics:
  - case: Unsafe path, duplicate destination, source overlap, reparse point, malformed
      ZIP, I/O failure or interrupted staging
    behavior: Reject or report failure with input identity; never delete or overwrite
      source; mark batch incomplete and do not present it as fully inspected. Retry
      uses a new isolated staging directory; partial output remains for manual inspection.
  - case: Missing, invalid or ambiguous metadata or date
    behavior: Report diagnostics and explicit unknown metadata values; if metadata
      date is unusable try filename date, then use Unknown only when no valid unique
      filename date exists; continue other items without guessing associations.
  - case: Staging security
    behavior: Before creating staging, reject any existing path component of every
      source, staging parent and archive root that is a symlink or reparse point,
      including ancestors; canonicalize absolute paths and reject equal, ancestor
      or descendant overlaps between any source, staging and archive roots. Create
      a new non-existing staging directory; reject ZIP traversal, absolute paths,
      links/reparse points and collisions, and never follow directory links when copying.
      Avoid destructive operations entirely.
risks:
- description: Cross-part or unfamiliar sidecars may contain metadata that cannot
    be safely associated with this sample-backed rule.
  mitigation: Expose unresolved sidecars and unknown values; retain all staged inputs;
    do not claim complete matching.
  blocking: false
- description: Intended paths can collide and represent a preview, not verified archive
    locations.
  mitigation: Report collisions and make no archive writes; actual integration belongs
    to S-02.
  blocking: false
later:
- item: Broaden metadata association using evidence from full multi-part exports.
  revisit_when: Additional representative export parts and matching evidence are available.
