- id: V-01
  criterion: Extraction preserves the source hierarchy and reports failures without
    removing source media.
  method: automated
  check: 'Automated nested ZIP and folder fixtures, multiple parts, traversal, collisions,
    links, overlap, malformed ZIP and injected I/O failure: verify hierarchy, diagnostics,
