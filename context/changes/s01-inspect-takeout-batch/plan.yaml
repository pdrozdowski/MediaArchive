- id: V-02
  criterion: Each recognized item shows available metadata, explicit unknowns, intended
    archive location and processing timestamps.
  method: automated
  check: Automated mixed media fixtures covering supported and unsupported extensions,
    unique sidecar and preserved fields, missing/malformed/competing and cross-part
