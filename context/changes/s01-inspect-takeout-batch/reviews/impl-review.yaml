findings:
  - id: F-01
    severity: low
    impact: low
    dimension: success_criteria
    target: src/MediaArchive.Core/BatchInspector.cs:154
    source_ref: plan.design.contracts[2]
    evidence: When an associated sidecar omits photoTakenTime or timestamp, SelectYear falls through to filename selection without adding a date diagnostic. The CLI contract says diagnostics cover unusable dates; the date-selection design also calls for preserving a diagnostic. Filename fallback itself returns the expected year.
    reproduction: Given a media filename with a valid year token and a uniquely matching JSON sidecar with no photoTakenTime field, inspect it; expect the filename-derived year and a date fallback diagnostic, but observe the year without that diagnostic. Existing tests cover absent sidecars and malformed/zero/out-of-range timestamp values, but not an associated sidecar missing the date fields.
    recommended_fix: Add a date fallback diagnostic when the sidecar or timestamp field is absent and add a focused assertion for that case; retain the approved filename fallback behavior.
    status: open
    rounds_seen: [0]
    verification: null
  - id: F-02
    severity: info
    impact: low
    dimension: architecture
    target: src/MediaArchive.Core/BatchInspector.cs:83
    source_ref: plan.tasks.T-02.done_when[0]
    evidence: The per-media pass scans all parsed sidecars for a local match; cross-part and unresolved-sidecar diagnostics also scan media collections. This yields repeated collection scans (approximately media-count times sidecar-count). No timing failure was observed and the available research sample is below 900 media files, so practical impact at larger export sizes is unmeasured.
    reproduction: Static inspection of the local association at line 83 and cross-part scans at lines 99 and 117; no representative-scale benchmark was run, so there is no measured slow-case reproduction.
    recommended_fix: If representative full-batch measurements show material delay, build dictionaries keyed by input root, directory, and title to avoid repeated scans; first add a realistic benchmark rather than changing behavior speculatively.
    status: open
    rounds_seen: [0]
    verification: null
