findings:
- id: R-01
  severity: major
  target: approach.decisions[1]; design.failure_semantics[1]; verification.V-02
  issue: The date decision requires filename fallback after an unusable sidecar date,
    while the missing/invalid date failure behavior says to emit unknown values; moreover
    the plan does not say how to decode and validate the sample sidecar photoTakenTime
    timestamp or derive its year. An implementation can choose Unknown or a filename
    year for the same item, or fail to use the available sidecar date.
  required_fix: Specify the accepted sidecar timestamp format, timezone/year interpretation
    and invalid/missing behavior, make the filename fallback and final Unknown precedence
    consistent in failure semantics, and require tests asserting each expected year.
    Preserve the user-selected metadata-then-filename precedence.
  evidence: plan approach year decision and design failure semantics; research F-07
    documents photoTakenTime; FR-002 and S-01 require intended location.
- id: R-02
  severity: major
  target: design.failure_semantics[2]; verification.V-01
  issue: Checking that the immediate staging parent is not a link does not exclude
    junctions or symlinks in its ancestor path. A lexically separate staging parent
    can resolve inside a source through an ancestor link, defeating the source/staging
    overlap guarantee and permitting unintended writes into source directories.
  required_fix: Define an implementable path safety check covering all existing path
    components and resolved overlap (or reject any reparse-point ancestor) for source,
    staging and archive roots; include a fixture where an ancestor link aliases a
    source and assert rejection before writes.
  evidence: plan staging security semantics; research F-01 identifies destination
    link risks; S-01 requires source preservation.
summary: 'Changes required: the plan preserves scope and sets conservative association
  policy, but date precedence/decoding and staging ancestor-link containment need
  executable rules before implementation.'
