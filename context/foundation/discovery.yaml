hypotheses:
- id: H-001
  statement: Existing export and folder comparison capabilities can form a safe archive workflow.
  decision_impact: If a representative trial fails, consider a different tool or custom gap rather than
    assuming reuse suffices.
  verification_method: Inspect official documentation then perform a non-destructive representative trial.
    Falsify on missing files, unsafe conflicts or unmanageable effort.
  status: inconclusive
  evidence_ids:
  - F-002
  - F-005
- id: H-002
  statement: A shared Google One plan can reduce payment administration.
  decision_impact: May favor paying for capacity during archive work.
  verification_method: Check official family-sharing eligibility and compare actual account usage and
    local prices. Falsify if ineligible or capacity is uneconomic.
  status: inconclusive
  evidence_ids:
  - F-004
- id: H-003
  statement: A browser extension can reduce bulk-deletion effort while safely restricting deletion to
    items already verified in both archive copies.
  decision_impact: If it cannot target and confirm archived items, it is unsuitable for archive-driven
    cleanup despite automating broad deletion.
  verification_method: Inspect source and permissions; test whether a reproducible mapping from Takeout
    files to selected Photos items exists, then trial only on a small account range after verified duplicate
    archive copies exist.
  status: inconclusive
  evidence_ids:
  - F-009
  - F-015
research_control:
  budget: Focused validation of the proposed identity chain; do not proceed to any destructive browser
    trial unless representative exports show complete URLs and deterministic matches to verified copies.
  next_question: Across a small camera and WhatsApp photo/video sample, which files have sidecars or URLs,
    and can missing records be matched safely to other device copies or relevant account exports?
  decision_impact: Determines whether the workflow can handle both metadata-rich and metadata-poor media,
    and which items must remain unmatched and ineligible for automatic cleanup.
  continuation_reason: A small existing export can test the critical identity assumption without broad
    research.
  stop_rationale: Stop broad research; test the identity bottleneck with a representative read-only sample.
synthesis:
  conclusion: proceed_to_shape
  recommended_direction: 'Conditional leader: ALT-008, an existing-tool-first local archive with verified
    two-copy preservation and separately validated low-effort intake and cloud cleanup. ALT-009 is the
    simpler fallback if ongoing paid capacity is acceptable; neither is demonstrated end to end.'
  rationale: 'ALT-008 addresses the desired long-term reduction in storage pressure without assuming a
    single API solves the lifecycle. It remains conditional: no acceptable cloud cleanup or family-usable
    intake has been proven. ALT-009 has fewer fragile moving parts but retains payments and recurring
    export work. The Takeout-to-Playwright identity chain is one hypothesis, not an established solution
    or a prerequisite for all alternatives.'
  critical_unknown_ids:
  - U-001
  - U-002
  - U-003
  - U-004
  - U-006
  - U-007
  shape_considerations:
  - Agree on subscription tradeoff and desired operating burden.
  - Establish independent copies and restoration checks before any cleanup.
  strategic_direction: integrate
  confidence: low
  stop_rationale: Existing evidence is sufficient to compare conditional workflows; further broad candidate
    research has low value until a small representative export tests the identity bottleneck. User explicitly
    requested proceeding to Shape with unknowns; feasibility questions remain unresolved and must not
    be represented as proven.
  end_to_end:
    capabilities:
    - 'Essential: preserve and reconcile both unique drive inventories; obtain account originals and metadata;
      organize by year; verify two independent recoverable copies; ingest future media; control cloud
      growth; provide a repeatable family-usable routine. Dependencies: verified copies precede cleanup;
      reliable intake and account settings precede disabling cloud backup. Optional: searchable photo
      catalog and automated exact-item cleanup.'
    - 'Essential: handle media with metadata and media without sidecars or reliable dates; preserve original
      bytes and record uncertain provenance, dates and matches rather than silently dropping or guessing
      them.'
    gap_analysis:
    - 'Cloud API limitations do not prove all cleanup impossible: supported native and extension approaches
      were rejected by the user; exact-item web automation via Takeout URLs is a hypothesis, with identity
      and UI behavior unverified (F-009, F-016, F-034, F-035). Retaining paid cloud capacity avoids deletion
      but changes the cost tradeoff.'
    - WPD succeeded for one device deletion after Shell attempts failed (F-029–F-033); it neither verifies
      transferred bytes nor removes cloud content. Quick Share availability and complete intake remain
      unknown (F-020–F-022).
    - Neither drive health, capacity, reconciliation, independent restores, metadata dates, all accounts,
      nor family usability is established. Avoid destructive cleanup until those links are demonstrated.
    - A user-supplied sidecar contains an item URL (F-036). The user reports some media, often WhatsApp
      downloads, has no metadata; whether other device or account exports fill gaps is a hypothesis. Preserve
      unmatched items and treat inferred dates and identity as unverified; do not automatically delete
      cloud items without an unambiguous match.
    recommendation: Trial a representative read-only sample of camera and WhatsApp photos and videos across
      available accounts and devices. Preserve unmatched originals, flag uncertain dates and matches,
      and test any recovered URL under the correct account. A match must be supported by evidence; unresolved
      items require review, not automated cleanup.
