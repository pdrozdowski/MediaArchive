unknowns:
- id: U-001
  category: known_unknown
  question: What are the capacities, free space, health, and unique contents of both drives and each account?
  significance: Determines safe staging, cost, and whether either drive needs replacement.
  verification_step: Non-destructively inventory drives and account storage, check health, and size temporary
    space.
  status: open
- id: U-002
  category: known_unknown
  question: Can a representative export and reconciliation preserve originals, capture dates and sidecars,
    and identify conflicts across paths?
  significance: Required before choosing a dependable workflow or deleting cloud files.
  verification_step: Run a small non-destructive trial with copies, including videos, edits, renamed duplicates
    and date anomalies.
  status: open
- id: U-003
  category: potential_unknown_unknown
  question: Are there unsupported, missing or corrupted files, edited versions, or account restrictions?
  significance: An apparently successful copy could omit irreplaceable content.
  verification_step: Review export logs, exceptions, file counts and representative restores, including
    the child account.
  status: open
- id: U-004
  category: known_unknown
  question: Can an appliance safely import and reconcile both old drives and three Google accounts, provide
    usable independent backups, and be operated by a nontechnical relative?
  significance: Determines whether a ready-made product achieves the complete outcome.
  verification_step: Check product documentation and pricing, then trial representative imports, duplicate
    cases, restore, scheduled backup, cloud deletion and onboarding with a nontechnical person.
  status: open
- id: U-005
  category: known_unknown
  question: Can a browser extension or native Undo device backup remove the intended cloud items safely
    without deleting unarchived items or causing device or partner re-uploads?
  significance: Native removal only covers items currently on a device; third-party UI automation cannot
    use a supported API or currently match Takeout files to the cloud library.
  verification_step: Inventory which cloud items are present on each device. Inspect extension source
    and permissions, then in one account run a dry-run/limited reversible batch only after two archive
    copies are verified; test device backup and partner-sharing effects.
  status: open
- id: U-006
  category: known_unknown
  question: Is Google Quick Share automatic Android-to-Windows photo/video backup available on the family's
    devices, and does it provide complete, repeatable copies with the original files intact?
  significance: Could offer the lowest-effort local PC ingest path, but a silent omission or altered copy
    would violate preservation needs.
  verification_step: Check for the feature on each relevant phone and Windows PC, then trial with representative
    photos/videos, compare counts and file hashes after transfer, and confirm behavior on a second connection.
  status: open
- id: U-007
  category: known_unknown
  question: For media with and without available sidecars, can records across exports and devices be matched
    unambiguously to archived originals and cloud items?
  significance: If the sidecar URL and local identity chain is complete, Playwright could target specific
    cloud items without enumerating the library; gaps or ambiguous mappings would block safe deletion.
  verification_step: Inspect a small representative sample including camera and WhatsApp media, photos
    and videos, duplicates and edits; inventory sidecars and URLs, test signed-in links and compare independent
    content evidence. Check whether other relevant account exports or device copies supply missing records;
    record unmatched items without inferring identity.
  status: open
