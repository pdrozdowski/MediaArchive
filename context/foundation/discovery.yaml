findings:
- id: F-001
  topic: problem_framing
  statement: The family reports two divergent drives containing potentially unique older files.
  classification: user_reported
  source_ids:
  - S-001
  implications: Neither drive can safely be treated as a disposable mirror.
- id: F-002
  topic: prior_art
  statement: Takeout downloads copies without deleting originals; filesystem timestamps can change and
    additional Google metadata can be in JSON.
  classification: evidence_backed
  source_ids:
  - S-002
  implications: Export and date organization need verification; Takeout alone neither removes cloud items
    nor frees storage.
- id: F-003
  topic: limitations
  statement: Device cleanup removes device files, while cloud deletion and backup settings have different
    consequences. Some photos do not count toward storage and supervised accounts may lack storage management.
  classification: evidence_backed
  source_ids:
  - S-003
  - S-004
  implications: Confirm account-specific savings and deletion behavior before deleting.
- id: F-004
  topic: prior_art
  statement: Google One can share storage with up to five family members without sharing their files,
    subject to eligibility.
  classification: evidence_backed
  source_ids:
  - S-005
  implications: One subscription may simplify payments but does not reconcile or back up old drives.
- id: F-005
  topic: prior_art
  statement: FreeFileSync compares matching relative paths and offers content comparison.
  classification: evidence_backed
  source_ids:
  - S-006
  implications: It can check matching paths but does not establish global duplicate identity across different
    paths.
- id: F-006
  topic: limitations
  statement: Google can transfer copies to supported services; unsupported files may be excluded and repeat
    transfers can duplicate items.
  classification: evidence_backed
  source_ids:
  - S-007
  implications: A cloud migration requires separate completeness and duplicate checks.
- id: F-007
  topic: problem_framing
  statement: The user has already used a manual archive approach and finds repeated relearning, labor
    and monthly payments unacceptable; a nontechnical relative should be able to use the solution.
  classification: user_reported
  source_ids:
  - S-008
  implications: Manual exports and sync are not sufficient as the end-state recommendation.
- id: F-008
  topic: prior_art
  statement: BeeStation Plus offers phone photo backup, a photo app, and backup to an external drive or
    Synology NAS; it can transfer photos from external drives.
  classification: evidence_backed
  source_ids:
  - S-009
  - S-010
  - S-011
  implications: An appliance is a plausible lower-maintenance alternative, but migration, duplicates,
    two independently browsable archives and real usability are not established.
- id: F-009
  topic: limitations
  statement: Current Google Photos APIs cannot enumerate and delete arbitrary items from an existing personal
    library. The Picker API exposes only user-selected media, while the Library API is limited to app-created
    content.
  classification: evidence_backed
  source_ids:
  - S-012
  - S-013
  implications: Supported APIs do not allow automated whole-library matching or deletion; use user-facing
    controls or another route.
- id: F-010
  topic: feasibility
  statement: Google Photos web supports selecting a continuous range of photos with Shift-click, and its
    storage manager offers recommended cleanup categories. Deletion is not an automated archive match,
    and deleting in Photos can remove synced local copies on devices with backup enabled. Items remain
    in Trash for 30 days; permanently deleted items cannot be recovered with Takeout.
  classification: evidence_backed
  source_ids:
  - S-014
  - S-015
  - S-016
  implications: Cleanup is not limited to one-item-at-a-time selection, but batch sizes, review burden,
    account-specific savings and safe phone behavior require a reversible trial after verified archive
    copies exist.
- id: F-011
  topic: prior_art
  statement: BeeStation documentation supports mobile photo backup, invited users with separate files,
    and scheduled backup to an external drive or paid C2 storage. Reviewed documentation does not establish
    automated import and reconciliation of three Google Photos libraries or two independently browsable
    year-organized archives.
  classification: evidence_backed
  source_ids:
  - S-017
  - S-009
  - S-010
  - S-011
  implications: BeeStation remains a plausible phone-ingest and browse appliance, but migration, archive
    layout and recoverability still need validation.
- id: F-012
  topic: constraints
  statement: The user rejects BeeStation because it is a high-price option that bundles hardware into
    its sale package.
  classification: user_reported
  source_ids:
  - S-018
  implications: Remove BeeStation from the viable shortlist on the user's stated cost preference; do not
    spend further research effort validating it unless the user reopens the option.
- id: F-013
  topic: limitations
  statement: Google Takeout creates and delivers downloadable data archives, and its Photos transfer option
    copies supported items to another service. Neither capability removes photos from the Google Photos
    library; deleting items and freeing Google storage requires a separate action.
  classification: evidence_backed
  source_ids:
  - S-019
  - S-020
  implications: Treat Takeout strictly as an export or copy step in the archive workflow; it cannot perform
    cloud cleanup or storage recovery.
- id: F-014
  topic: prior_art
  statement: Google Photos has a native Undo device backup action that removes from Google Photos all
    photos and videos currently found on the selected device while keeping those local files on that device.
    It also removes them from albums, shared albums, search results and memories; device-folder and Locked
    Folder items are included. Backup is turned off on that device, but other devices on the same account
    or partner auto-save can upload the media again.
  classification: evidence_backed
  source_ids:
  - S-015
  implications: This is a supported bulk cloud-removal route for media present on a phone, but it does
    not cover cloud-only older media or prove that the complete family archive exists on each device.
    Preventing re-upload requires checking backup on the account's other devices and partner auto-save
    settings; leaving backup off also removes automatic cloud backup for new photos from that device.
- id: F-015
  topic: prior_art
  statement: Third-party browser extensions exist that automate Google Photos web selection and moving
    items to Trash through the visible page because the supported Photos API cannot delete arbitrary existing
    library items. One inspected open-source project offers dry run, batches, stopping, and duplicate
    review; the Chrome Web Store listing reports 10,000 users. The tool operates on the current Photos
    view and its date/type filters are partly paid; it does not claim to match a Takeout archive manifest
    against Google Photos.
  classification: evidence_backed
  source_ids:
  - S-021
  - S-022
  - S-012
  implications: Browser automation can reduce repetitive UI work for broad or filtered deletion, but it
    remains dependent on Google's changing page, requires a trusted extension with access to the signed-in
    Photos page, and does not solve exact archive-to-cloud matching. A non-destructive preview and a limited
    trial are prerequisites before any bulk run.
- id: F-016
  topic: constraints
  statement: The user assesses all three currently identified Google Photos removal optionsâ€”native Undo
    device backup, manual web range selection, and third-party browser-extension automationâ€”as cumbersome
    or unfeasible for the family's intended workflow.
  classification: user_reported
  source_ids:
  - S-023
  implications: Exclude all three options from the acceptable solution shortlist; do not recommend a trial
    or implementation of them as the end-state. Continue searching for a materially different removal
    approach that meets the user's low-effort requirement.
- id: F-017
  topic: prior_art
  statement: Google Photos offers a built-in Recover storage action to convert existing eligible Original
    quality media to Storage saver, and a separate setting for future backup quality. Storage saver compresses
    photos, can resize photos above 16 MP and videos above 1080p, and may leave some files uncompressed.
    Storage saver uploads after June 1, 2021 still count toward account storage; the conversion is available
    at most once per day and is hidden for accounts with unlimited Photos storage.
  classification: evidence_backed
  source_ids:
  - S-024
  - S-025
  implications: This was investigated as a possible non-deletion path, but the user rejected the risk
    of altering media and it is excluded from acceptable options.
- id: F-018
  topic: constraints
  statement: The user rejects Storage saver because it may alter original media and they do not want to
    risk unintended data corruption.
  classification: user_reported
  source_ids:
  - S-026
  implications: Exclude Recover storage and Storage saver from acceptable solution options; do not treat
    a local copy as sufficient justification to change cloud media.
- id: F-019
  topic: prior_art
  statement: Windows Photos can import selected photos and videos from an unlocked Android phone over
    a file-transfer USB cable; the user chooses what to import and the destination.
  classification: evidence_backed
  source_ids:
  - S-027
  implications: This is a straightforward copy/import path, but the documented workflow is user-driven
    and does not establish automatic import or two-drive verification.
- id: F-020
  topic: limitations
  statement: SyncBackPro/SE can run an MTP backup profile when a USB-connected phone is detected, but
    MTP requires the phone unlocked and does not support SyncBack's verification, hash comparison, integrity
    check or file versioning; device behavior and metadata support vary.
  classification: evidence_backed
  source_ids:
  - S-028
  - S-029
  implications: Connection-triggered copying exists, but this option does not meet the preservation confidence
    threshold without an independent verification method and device-specific trial; it is also unavailable
    in SyncBackFree.
- id: F-021
  topic: prior_art
  statement: Google documents automatic Android-to-Windows photo/video backup using Quick Share in Google
    Play services v26.43, dated 2026-11-02; the public release note does not describe setup, eligibility
    or transfer behavior, and Google's general feature notes say some features may be experimental or
    limited to certain users.
  classification: evidence_backed
  source_ids:
  - S-030
  implications: This is a promising low-effort PC-ingest lead, but availability on the family's phones
    and whether it safely and completely copies original files remain unverified. Googleâ€™s published
    Quick Share guide describes ordinary user-initiated sharing, not this backup feature.
- id: F-022
  topic: limitations
  statement: Copying new phone media to a PC does not remove existing items from Google Photos or itself
    stop future Google Photos uploads.
  classification: evidence_backed
  source_ids:
  - S-027
  - S-031
  implications: Even a successful local-ingest workflow only limits future quota growth if Photos backup
    is separately turned off on each relevant phone; the current cloud library and its storage use remain.
- id: F-023
  topic: prior_art
  statement: Android's documented Windows USB File Transfer workflow is to unlock the phone, connect by
    cable, select File Transfer in the USB notification, drag files in Windows, eject, and unplug; it
    is a user-operated file move/copy interface rather than an automatic backup.
  classification: evidence_backed
  source_ids:
  - S-032
  implications: This is the precise low-cost wired workflow the user meant; evaluate manual selection/transfer
    burden and how to verify copied originals before any phone-side removal.
- id: F-024
  topic: limitations
  statement: USB File Transfer does not itself instruct Google Photos to delete or alter a cloud item.
    Google Photos can still display a local photo and its backup status; Google's Free up space function
    explicitly removes device copies while retaining backed-up photos in the Photos library. The reviewed
    documentation does not establish the effect of deleting a file through every Android file manager
    on all device models or sync configurations.
  classification: evidence_backed
  source_ids:
  - S-032
  - S-033
  - S-034
  implications: Copying to PC alone should be treated as a separate local copy. Do not delete the phone
    copy until the PC copy is confirmed; if removing it, use a tested device-specific method and check
    that it remains in Google Photos. The cloud copy continues to use Google storage.
- id: F-025
  topic: limitations
  statement: In a user-observed test on a Samsung Galaxy S25, manually deleting the phone file 20261111_214936.jpg
    made it disappear from the phone's Google Photos app view, while the user could still open the same
    item through its photos.google.com link.
  classification: user_reported
  source_ids:
  - S-035
  implications: The local item disappearing from the app does not establish that the cloud copy was deleted;
    in this single test the web item remained. Treat the browser link as evidence of the surviving cloud
    item, while recognizing that a one-photo test does not establish all app states or devices.
- id: F-026
  topic: prior_art
  statement: Windows' built-in Shell COM interface successfully enumerated the connected Samsung Galaxy
    S25, its internal storage folders and DCIM/Camera contents in a read-only probe; the manually removed
    photo was no longer on the phone. Microsoft's WPD API is the documented application interface for
    enumerating portable-device objects and transferring content.
  classification: evidence_backed
  source_ids:
  - S-036
  - S-037
  - S-038
  implications: Shell enumeration is demonstrated; later direct WPD enumeration and one-object deletion
    supersede the earlier untested status (F-033). Neither proves reliable bulk transfer or cloud removal.
- id: F-027
  topic: prior_art
  statement: A reproducible, read-only PowerShell prototype using Windows Shell.Application COM is documented
    for enumerating the connected Galaxy S25, internal storage and DCIM/Camera.
  classification: evidence_backed
  source_ids:
  - S-038
  - S-039
  implications: Reuse the probe as the known-good baseline when comparing a direct C# WPD implementation;
    it lists names and modified details only and does not establish transfer integrity.
- id: F-028
  topic: prior_art
  statement: A C# probe using Windows Shell COM found 20261111_222543.jpg on the S25, copied it locally,
    and exposed Windows Shell properties; EXIF decoded from the local copy reports a 4000x3000 Samsung
    Galaxy S25 JPEG captured at 2026-11-11 22:25:43, f/1.8, ISO 800, 5.4 mm (59 mm equivalent), with no
    GPS EXIF tag. The local copy is 2,528,963 bytes with SHA-256 D7143FCED513DB4862F8666CC2A9AA23D04E7EB51899BF249CFE1CDA59314FAA.
  classification: evidence_backed
  source_ids:
  - S-040
  implications: This provides a concrete MTP read-and-copy prototype and media metadata record; MTP exposed
    no source hash for byte-for-byte verification, and the local copy is retained temporarily as a safety
    copy.
- id: F-029
  topic: limitations
  statement: The Shell COM delete verb stalled after a sound with no visible popup, and a Shift+Delete-style
    Windows IFileOperation attempt failed to parse the MTP shell path (HRESULT 0x80070057) before queuing
    deletion. Read-only re-enumeration confirmed the exact photo remains on the S25.
  classification: evidence_backed
  source_ids:
  - S-041
  - S-042
  - S-043
  - S-044
  implications: Neither attempt deleted the file. The evidence copy remains local; the direct WPD IPortableDeviceContent.Delete
    operation has not yet been successfully exercised from C#.
- id: F-030
  topic: limitations
  statement: A third attempt invoked the exact photo's Shell delete verb from a separate visible PowerShell
    process, but the computer-control connection could not inspect that process; subsequent read-only
    enumeration still found the photo in DCIM/Camera.
  classification: evidence_backed
  source_ids:
  - S-045
  - S-046
  implications: Phone-side deletion remains unconfirmed; the exact photo was still present at the latest
    check.
- id: F-031
  topic: feasibility
  statement: Microsoft?s Windows-classic-samples WPD sample deletes a device object by adding its object
    ID to an IPortableDevicePropVariantCollection and calling IPortableDeviceContent::Delete with PORTABLE_DEVICE_DELETE_NO_RECURSION;
    Microsoft describes IPortableDeviceContent as supporting device content enumeration and deletion,
    and WPD supports MTP devices.
  classification: evidence_backed
  source_ids:
  - S-047
  - S-048
  - S-049
  implications: The official direct WPD route was subsequently tested successfully for one device object
    (F-033); this does not establish cloud deletion or a complete workflow.
- id: F-032
  topic: limitations
  statement: On the latest retry, the user heard the device/system sound but saw no popup and pressing
    Y, Enter or Escape had no visible effect.
  classification: user_reported
  source_ids:
  - S-050
  implications: The Shell delete attempt provides no usable visible prompt or confirmation; do not infer
    deletion from the sound, and verify device state through read-only enumeration.
- id: F-033
  topic: feasibility
  statement: A C# probe using Windows WPD COM enumerated the Samsung Galaxy S25, identified the unique
    object ID o5A9 for 20261111_222543.jpg at Pami?? wewn?trzna/DCIM/Camera, and called IPortableDeviceContent::Delete
    once with PORTABLE_DEVICE_DELETE_NO_RECURSION; the API returned S_OK. A subsequent read-only WPD enumeration
    no longer found the target.
  classification: evidence_backed
  source_ids:
  - S-047
  - S-051
  - S-052
  implications: Direct WPD deletion is now demonstrated on this S25 for one explicitly matched object.
    This confirms device removal only; Google Photos cloud status and behavior were not checked by this
    probe. The first C# property query failed because it requested unsupported keys; using GetSupportedProperties
    before GetValues resolved enumeration safely.
- id: F-034
  topic: limitations
  statement: Google documents that the Photos web Details panel can display an item's file name, but the
    supported Photos APIs are restricted to app-created content and Picker API selection; they do not
    provide general enumeration or deletion of arbitrary existing library items. Playwright can interact
    with visible web controls using role, text and other locators with auto-waiting and actionability
    checks, but those browser capabilities do not establish stable archive-to-cloud identity matching
    or safe deletion targeting.
  classification: evidence_backed
  source_ids:
  - S-053
  - S-054
  - S-055
  implications: Playwright could automate a known item if a sidecar URL is valid and its media is matched
    to verified local copies, but URL coverage, persistence and the full identity chain remain untested.
    Do not treat a filename or date match alone as proof where duplicates or edited variants exist.
- id: F-035
  topic: feasibility
  statement: Google's supported MediaItem resource defines a persistent media item ID and a signed-in-user
    Photos product URL, but API listing and retrieval are now restricted to app-created items. Secondary
    documentation and inspected public examples of Takeout sidecars report a per-item url field containing
    a photos.google.com/photo/â€¦ link, alongside title and metadata. The Takeout URL may therefore provide
    the Google Photos item identifier without using the general-library API.
  classification: evidence_backed
  source_ids:
  - S-056
  - S-057
  implications: This materially improves feasibility of linking a Takeout record to a cloud-side item
    URL. It does not establish that every exported item has a URL, that the URL identifier survives all
    edits/duplicates or remains usable, or that matching Takeout media bytes to the archive and phone
    is accurate; inspect representative actual exports before relying on the link for deletion.
- id: F-036
  topic: feasibility
  statement: The user supplied one Takeout photo sidecar containing a Google Photos item URL, title, timestamps,
    location and Android upload origin. The user reports that some media, often saved from WhatsApp, lacks
    metadata; exports from other devices might supply metadata for some items but this remains unverified.
  classification: user_reported
  source_ids:
  - S-058
  implications: One URL field is observed in a user-provided example, not independently tested for accessibility,
    completeness, stable identity or correspondence to an API ID. Preserve metadata-free originals; seek
    corroborating records across accounts/devices without assuming coverage or equivalence.
