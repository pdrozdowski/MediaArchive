decisions:
- id: D-001
  topic: Photo organization
  decision: Use PhotoPrism Community Edition as the current candidate for organizing media, subject to
    further investigation.
  confirmed_by_user: true
- id: D-002
  topic: Google data export
  decision: Use Google Takeout as the primary export choice.
  confirmed_by_user: true
- id: D-003
  topic: Archive synchronization and repair
  decision: User proposes custom Python scripts to distribute an outbox to both target drives and repair
    and organize the existing archive by year/month or year.
  confirmed_by_user: true
- id: D-004
  topic: Appliance option
  decision: Reject Synology BeeStation because its high price bundles hardware into the sale package.
  confirmed_by_user: true
- id: D-005
  topic: Google Photos bulk removal
  decision: Reject native Undo device backup, manual web range selection and third-party browser-extension
    deletion as cumbersome or unfeasible for the family's workflow.
  confirmed_by_user: true
- id: D-006
  topic: Media fidelity
  decision: Reject Google Photos Recover storage and Storage saver because they may alter original media
    and the user will not accept the risk of unintended data corruption.
  confirmed_by_user: true
- id: D-007
  topic: Windows phone access API
  decision: Use Microsoft's official Windows Portable Devices (WPD) API for application-level Android
    MTP access; a C# probe enumerated the S25 and successfully deleted one explicitly matched test photo.
  confirmed_by_user: true
