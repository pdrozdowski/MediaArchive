ideation:
  path: context/foundation/ideation.yaml
  schema_version: 1
problem_assessment:
  assessment: supported
  reframing_needed: false
  notes: User reports recurring storage pressure and irreplaceable drive-only media; manual workflows
    are already tried and too cumbersome to repeat or recommend to a nontechnical relative.
success_criteria:
- id: SC-001
  criterion: Preserve existing media, including files found only on old drives.
  priority: hard
  source: Ideation brownfield.must_preserve
  verification: user_confirmed
- id: SC-002
  criterion: Continue capturing photos while relieving recurring storage pressure across three accounts.
  priority: important
  source: Ideation desired outcomes
  verification: user_confirmed
- id: SC-003
  criterion: Maintain two easily synchronized archive copies and browse by year.
  priority: important
  source: Ideation desired outcomes
  verification: user_confirmed
- id: SC-004
  criterion: Make ongoing work repeatable and reduce time spent managing storage.
  priority: important
  source: Ideation desired outcomes
  verification: user_confirmed
- id: SC-005
  criterion: Avoid or reduce recurring payment hassle.
  priority: important
  source: Ideation constraints; reduction inferred
  verification: inferred
- id: SC-006
  criterion: A nontechnical relative can adopt and repeat the solution without relearning a cumbersome
    process; ongoing work should be minimal.
  priority: hard
  source: User clarification 2026-11-08
  verification: user_confirmed
system_context:
  boundaries:
  - Three separate Google accounts, Android devices and two divergent archive drives.
  - Google storage includes services beyond Photos; account contents and sizes are unverified.
  existing_capabilities:
  - Google Takeout exports, storage management and family plan sharing.
  - Two existing drives, health and capacity unverified.
  critical_dependencies:
  - Working hardware and sufficient temporary capacity; account access and supervised-account restrictions.
  - Reliable export, metadata handling, non-destructive reconciliation and recovery verification.
