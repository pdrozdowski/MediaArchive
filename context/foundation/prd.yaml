direction:
  problem: Family media is spread across cloud accounts and divergent older drives, while
    storage pressure and manual management recur.
  primary_actor: Family archive operator
  chosen_approach: Establish a local archive workflow, beginning with one verified archive
    copy.
  rationale: The user selected a straightforward end-to-end local archive as the first step.
  target_outcome: Preserve and organize family media in a usable verified local archive through
    a repeatable workflow.
discovery_review:
- id: REV-001
  discovery_refs:
  - F-001
  - U-001
  - U-002
  disposition: noted
  explanation: Two divergent drives contain potentially unique older media; safe reconciliation
    and recoverable copies remain unproven.
- id: REV-002
  discovery_refs:
  - F-009
  - F-016
  - F-035
  - F-036
  - U-007
  disposition: noted
  explanation: Cloud cleanup feasibility and reliable identification remain unproven, especially
    for media without item references; the user accepts this risk while retaining cleanup
    in scope.
- id: REV-003
  discovery_refs:
  - F-020
  - F-021
  - F-022
  - F-033
  - U-006
  disposition: noted
  explanation: One device-side removal was demonstrated, but complete reliable family intake
    and cloud quota relief are not demonstrated.
- id: REV-004
  discovery_refs:
  - ALT-008
  - ALT-009
  disposition: noted
  explanation: Conditional local archiving may reduce storage pressure; paid cloud retention
    is simpler for capture but retains subscription and export burden. Neither direction is
    approved by this review.
- id: REV-005
  discovery_refs:
  - F-012
  - F-018
  - F-007
  disposition: noted
  explanation: User rejected BeeStation on cost and bundled hardware and rejected lossy storage
    conversion; usability for nontechnical relatives matters.
decisions:
- id: D-001
  topic: Product direction
  decision: Start with a local archive workflow and one verified archive copy.
  rationale: User selected a straightforward end-to-end first step.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - U-002
- id: D-002
  topic: Cleanup eligibility and missing items
  decision: After archive integration and hash verification, proceed with cleanup. A missing
    Google Photos link is expected for some items; warn the user if the corresponding phone
    file cannot be found.
  rationale: The user considers archived media safe for cleanup and expects some links to
    be absent.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - F-033
  - F-036
  - U-007
- id: D-003
  topic: Batch outcome report
  decision: Retain a single text report with a timestamped filename for the batch outcome.
  rationale: User selected a simple report.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
- id: D-004
  topic: Ambiguous phone cleanup
  decision: Leave ambiguous phone matches untouched and report ambiguous matches or failed
    deletions to the user for guidance.
  rationale: Timestamp-based filenames reduce but do not eliminate ambiguity.
  confirmed_by_user: true
  discovery_refs:
  - F-033
  - U-007
- id: D-005
  topic: Recovery and resumption
  decision: When processing encounters a problem, allow a user decision or manual fix, then
    resume the process.
  rationale: User wants to correct issues and continue the batch.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - U-002
- id: D-006
  topic: Operating model
  decision: The workflow is operated by a single user on one computer.
  rationale: User specified the operating model.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
- id: D-007
  topic: Google Photos session
  decision: Use Google sign-in for the Google Photos session.
  rationale: The user wants to use the sign-in needed for the session.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - F-034
- id: D-008
  topic: Local application access
  decision: Access to the computer is sufficient; no separate local application sign-in is
    required.
  rationale: User confirmed the single-user access model.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
- id: D-009
  topic: Persistent media catalog
  decision: Maintain a lightweight local file-based catalog that persists beyond batch cleanup
    and supports identification, duplicate detection and future metadata and tag searching.
  rationale: User confirmed the catalog and its intended uses.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - U-002
- id: D-010
  topic: Cloud cleanup and recovery
  decision: Retain cloud cleanup, accept its feasibility and reliability risk, and preserve
    verified archive results when cleanup is unresolved.
  rationale: User confirmed the intended outcome and accepted the risk.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - F-034
  - F-036
  - U-007
- id: D-011
  topic: Batch reports
  decision: Store a timestamp-named text report for each batch in C:\tmp and retain it after
    temporary batch data is removed.
  rationale: User specified the report location and retention.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
- id: D-012
  topic: Repeatability and recovery
  decision: Repeated or resumed processing must preserve results and avoid duplicate archived
    media, repeated confirmed destructive operations, and corruption.
  rationale: User confirmed idempotency and recovery outcomes.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - U-002
- id: D-013
  topic: Archive organization
  decision: Organize archived media in folders by year.
  rationale: User confirmed the original outcome of browsing media by year.
  confirmed_by_user: true
  discovery_refs:
  - ALT-008
  - U-002
scope:
  first_valuable_flow:
  - Extract a Takeout export into the staging location, retaining its folder hierarchy as
    the batch input.
  - Prepare each media item in the batch location, retaining available metadata or recording
    unknowns, the intended archive location and relevant processing timestamps.
  - Integrate each item into one local archive, detect duplicates, verify content and retain
    its catalog information.
  - After all batch media are integrated and verified, remove corresponding items from the
    connected phone; confirm outcomes, warn about missing items, and leave ambiguous matches
    untouched for user guidance.
  - Attempt cleanup of eligible Google Photos items with available references; record missing
    references and unsuccessful outcomes, and allow unresolved operations to be retried.
  - Pause for user decisions or manual fixes as needed and resume without losing completed
    work; retain verified archive results independently of cleanup outcomes.
  - Once processing is complete, clean temporary staging and batch data and retain a timestamp-named
    text report in C:\tmp.
  in_scope:
  - Takeout staging and batch preparation; one verified local archive; persistent media catalog;
    phone and Google Photos cleanup; recovery and resumption; and a retained batch report.
  - Year-based archive folders for browsing media.
  later:
  - A second archive copy and synchronization.
  - A search interface for the catalog.
success_criteria:
  primary:
  - A Takeout batch can be integrated into a verified local archive and proceed through phone
    and available-link cloud cleanup, with outcomes reported.
  - Archived media can be browsed in folders organized by year.
  secondary:
  - Reduce repeated manual handling of batches.
  guardrails:
  - Preserve source media until archive integration and hash verification succeed.
  - Do not remove ambiguous phone matches; warn and request user guidance.
  - Repeated or resumed processing does not duplicate archived media, lose completed results,
    repeat confirmed destructive operations, or corrupt archive contents or metadata.
  - Uncertain operations remain recoverable without assuming their outcome.
