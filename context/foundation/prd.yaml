user_stories:
- id: US-01
  title: Archive and clean a Takeout batch
  given: A Takeout export and a connected phone are available
  when: The user processes the batch
  then: Media is integrated and hash verified before eligible cleanup, and a timestamped report
    records outcomes.
  acceptance_criteria:
  - Each media item is archived and its content verified before it becomes eligible for source
    cleanup.
  - Missing phone files produce warnings; ambiguous phone matches remain untouched and are
    reported for guidance.
  - Eligible cloud items are attempted when references are available; missing references and
    unsuccessful operations are reported and unresolved operations can be retried.
  - Verified archive results remain available regardless of cleanup outcomes.
  - The timestamp-named text report in C:\tmp remains after temporary batch data is removed.
  - Problems can be resolved by a user decision or manual fix and processing can resume without
    restarting the entire batch.
  - Archived media is organized in folders by year for browsing.
  - Extraction preserves the relative folder hierarchy; an extraction failure is reported
    and the batch can be resumed after correction.
  - Each prepared item records available metadata, explicit unknowns, intended archive location
    and processing timestamps.
  - Phone cleanup does not begin until every batch media item has been integrated and hash
    verified; a verification failure is reported and leaves source media intact.
  - A detected duplicate is associated with the verified archived content without creating
    another archived copy.
  - A missing cloud reference is reported without treating the cloud item as removed; failed
    or uncertain cleanup remains unresolved.
  - If Google sign-in fails or expires, cloud cleanup remains unresolved and can resume after
    authorization without losing verified archive results.
  - If the report cannot be retained or temporary data cannot be removed, the failure is reported
    and processing can resume after a manual fix.
  - When duplicate media have distinct available source metadata or provenance, retain each
    distinct value and its source association in the catalog without silently overwriting
    information or creating another media file.
  requirement_ids:
  - FR-001
  - FR-002
  - FR-003
  - FR-004
  - FR-005
  - FR-006
  - FR-007
  - FR-008
  - FR-009
  - FR-010
  - FR-011
  - FR-012
  - FR-013
  - FR-014
- id: US-02
  title: Retain catalog and resume safely
  given: A batch includes archived media and processing may be interrupted
  when: The user restarts or resumes processing, including a repeated execution
  then: Completed results and catalog information remain available without duplicate archived
    media or repeated confirmed destructive operations.
  acceptance_criteria:
  - The catalog survives application restarts and removal of temporary batch data, retaining
    available original metadata, specified media attributes and tags.
  - Repeated or resumed processing does not corrupt archived media or metadata.
  - An interrupted or uncertain operation is recoverable without assuming it succeeded or
    failed.
  - After restart, the catalog retains each available specified media attribute and marks
    unavailable attributes unknown; associated tags remain attached to the item.
  - A repeated batch recognizes previously integrated media and confirmed destructive operations,
    without creating a duplicate archive copy or repeating those operations.
  - An uncertain cleanup outcome is recorded as unresolved and checked or resolved with user
    guidance before any destructive retry.
  - For cloud cleanup retry, retain the item identity, available cloud reference, archive
    verification result and last known cleanup outcome beyond temporary batch cleanup; missing
    references remain explicitly unknown.
  requirement_ids:
  - FR-008
  - FR-010
  - FR-011
  - FR-012
  - FR-013
business_rules:
- An item becomes eligible for source cleanup after archive integration and successful content
  verification.
- Ambiguous phone matches remain untouched until the user provides guidance.
- Verified archive results remain available independently of cleanup outcomes.
- Phone cleanup starts only after all media in the batch have been integrated and hash verified.
- A failed or uncertain destructive operation is not recorded as confirmed; its outcome must
  be resolved before repeating it.
- Temporary data is removed only when information needed to retain completed results and retry
  unresolved operations is preserved.
- Deduplication preserves distinct available source metadata and provenance and their source
  associations without silently overwriting information or duplicating media files.
non_functional_requirements:
- id: NFR-001
  property: The media catalog is lightweight, local and file-based.
  acceptance_target: Catalog is stored locally in files.
- id: NFR-002
  property: Catalog persistence
  acceptance_target: Catalog survives application restarts and temporary batch cleanup.
- id: NFR-003
  property: Safe repeatability and recovery
  acceptance_target: Repeated or resumed execution preserves completed results, avoids duplicate
    archive media and repeated confirmed destructive operations, and does not corrupt archive
    contents or metadata.
access_control:
  model: Single user on one computer, with no separate local application sign-in; Google sign-in
    is used for the Photos session.
  capabilities:
  - Operate and resume batches.
  - Sign in to Google Photos for cloud cleanup.
brownfield:
  current_system: Three Google accounts and two divergent older drives containing family media,
    including potentially unique originals.
  preserved_behavior:
