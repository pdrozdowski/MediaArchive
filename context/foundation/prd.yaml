    succeed.
  compatibility_constraints: []
non_goals:
- statement: Maintain a second synchronized archive copy in the first version.
  rationale: The user chose to start with one verified archive copy.
- statement: Support concurrent or independent operation by multiple users.
  rationale: The user specified one operator on one computer.
- statement: Provide a search user interface in the initial scope.
  rationale: The catalog retains information needed for later searching and filtering.
